# Production Alertmanager template. Render with envsubst and keep the rendered
# file outside version control - webhook URLs embed secrets.
#   SLACK_WEBHOOK_URL=... envsubst < monitoring/alertmanager.prod.yml \
#     > /etc/alertmanager/alertmanager.yml
global:
  resolve_timeout: 5m

route:
  receiver: auxilia-slack
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers:
        - severity="critical"
      receiver: auxilia-slack
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: auxilia-slack
    slack_configs:
      - api_url: "${SLACK_WEBHOOK_URL}"
        channel: "#alerts-auxilia"
        send_resolved: true
        title: "[{{ .CommonLabels.severity }}] {{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}\n{{ end }}"
