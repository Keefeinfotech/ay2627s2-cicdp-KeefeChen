groups:
  - name: auxilia
    rules:
      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "High 5xx error rate on Auxilia backend"
      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "p95 latency above 1s"
      - alert: BackendDown
        expr: up{job="auxilia-backend"} == 0
        for: 1m
        labels: { severity: critical }
        annotations:
          summary: "Auxilia backend is down"
