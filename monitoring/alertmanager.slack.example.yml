# Production-ready Alertmanager configuration (EXAMPLE, disabled by default).
#
# This file is the production counterpart of alertmanager.yml (the local-demo
# default, which intentionally points at an inert webhook). To use it:
#
#   1. Export your Slack webhook URL (do not commit it):
#        export SLACK_WEBHOOK_URL="https://hooks.slack.com/services/..."
#   2. Mount this file instead of the demo one in docker-compose.yml:
#        - ./monitoring/alertmanager.slack.example.yml:/etc/alertmanager/alertmanager.yml:ro
#      and pass the variable through, e.g. under the alertmanager service:
#        environment:
#          SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:?Set SLACK_WEBHOOK_URL in the environment or in .env}
#   3. Alertmanager expands ${VAR} from its own environment at startup.
#
# For PagerDuty, replace slack_configs with:
#   pagerduty_configs:
#     - routing_key: ${PAGERDUTY_ROUTING_KEY}
#       description: '{{ .CommonAnnotations.summary }}'
#
# SECURITY: the webhook URL embeds a secret. Mount this file as a secret in
# real deployments instead of committing a live URL; prefer the platform's
# secret manager over a .env file.

global:
  resolve_timeout: 5m

route:
  receiver: auxilia-slack
  group_by: ["alertname", "service"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # Critical-severity alerts (e.g. HighErrorRate, BackendDown) page faster.
    - matchers:
        - severity="critical"
      receiver: auxilia-slack
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: auxilia-slack
    slack_configs:
      - api_url: ${SLACK_WEBHOOK_URL}
        channel: "#alerts-auxilia"
        send_resolved: true
        title: "{{ .CommonAnnotations.summary }}"
        text: "{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}"
