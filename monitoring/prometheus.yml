# Prometheus scrape configuration for the Auxilia backend (local demo).
#
# SECURITY: `credentials` below is a throwaway local-demo token used ONLY by
# this docker compose profile on your machine — it is not a production secret
# and must be rotated if the compose profile is ever exposed beyond localhost.
# In production, set METRICS_TOKEN on the backend and pass the same value here
# (mount it as a secret instead of committing it for real deployments).
global:
  scrape_interval: 10s
  evaluation_interval: 15s

# Alerting rules evaluated every `evaluation_interval`. The file is mounted
# into the container by docker-compose.yml (monitoring profile); when running
# Prometheus without compose, keep prometheus-alerts.yml next to this file.
rule_files:
  - prometheus-alerts.yml

# Where to send the alerts those rules fire. Uses the Alertmanager example
# in this directory (monitoring/alertmanager.yml) with the compose profile;
# for a real deployment, point this at your managed Alertmanager/Grafana
# notification pipeline instead.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

scrape_configs:
  - job_name: auxilia-backend
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials: auxilia-local-metrics-token
    static_configs:
      - targets:
          - backend:3000
        labels:
          service: auxilia-backend
          tier: backend
