# Production scrape configuration template.
# Render the ${...} placeholders before use (never commit rendered secrets):
#   METRICS_TOKEN=... BACKEND_METRICS_URL=https://<service>.onrender.com \
#     envsubst < monitoring/prometheus-prod.yml > /etc/prometheus/prometheus.yml
global:
  scrape_interval: 15s
  evaluation_interval: 30s

rule_files:
  - prometheus-alerts.yml
  - prometheus-slo.yml

# Point at the hosted Alertmanager/Grafana alerting endpoint. Do not use the
# local example in alertmanager.yml for production.
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "${ALERTMANAGER_HOST}:9093"

scrape_configs:
  - job_name: auxilia-backend
    metrics_path: /metrics
    scheme: https
    authorization:
      type: Bearer
      credentials: "${METRICS_TOKEN}"
    static_configs:
      - targets:
          - "${BACKEND_METRICS_URL}"
        labels:
          service: auxilia-backend
          tier: backend
          environment: production
