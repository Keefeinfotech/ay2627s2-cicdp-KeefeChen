name: frontend
description: "Auxilia - offline-first task manager with accounts and an AI assistant."

# Prevent accidental publication to pub.dSev.
publish_to: 'none'

# Application version and build number.
version: 1.0.0+1

# Dart SDK compatibility.
environment:
  sdk: '>=3.13.0 <4.0.0'

# Application dependencies.
dependencies:
  flutter:
    sdk: flutter

  # UI and platform utilities.
  cupertino_icons: ^2.0.0

  # Video playback support
  video_player: ^2.8.2

  # Networking.
  http: ^1.6.0
  dio: ^5.11.1
  json_annotation: ^4.12.0

  # Local preferences and secure storage.
  shared_preferences: ^2.5.6
  flutter_secure_storage: ^11.2.0

  # Web support.
  web: ^1.1.2
  flutter_web_plugins:
    sdk: flutter

  # State management.
  flutter_riverpod: ^3.4.3
  connectivity_plus: ^7.3.2
  speech_to_text: ^7.5.0

# Development dependencies.
dev_dependencies:
  # Flutter unit and widget testing.
  flutter_test:
    sdk: flutter

  # Static analysis and linting.
  flutter_lints: ^6.0.0

# Flutter-specific configuration.
flutter:
  uses-material-design: true

  # Bundled assets. Keep paths aligned with the files committed under assets/.
  assets:
    - assets/videos/auth_bg.mp4

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
