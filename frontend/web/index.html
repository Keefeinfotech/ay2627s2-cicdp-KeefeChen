<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Auxilia keeps study tasks, reminders and shared group work in one calm workspace.">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!--
    Content Security Policy for the Flutter web build.

    * Scripts stay same-origin; the only third-party scripts are Flutter
      CanvasKit from gstatic.com and Cloudflare Turnstile.
    * CanvasKit/WASM needs 'wasm-unsafe-eval'. Release builds do not require
      'unsafe-eval'; keep it out so injected strings cannot be evaluated.
    * Flutter renders through inline styles via JavaScript (element.style),
      which CSP style-src does not restrict. No 'unsafe-inline' needed.
    * API calls are limited to the backend origin (localhost in dev) plus
      gstatic.com for CanvasKit and challenges.cloudflare.com for Turnstile.
      Do not use 'https:' wildcard as it allows connections to any HTTPS
      domain.

    Serve these headers from the production host as well (meta tags cannot set
    frame-ancestors or HSTS):
      Content-Security-Policy: frame-ancestors 'none'
      Strict-Transport-Security: max-age=31536000; includeSubDomains
      X-Content-Type-Options: nosniff
      Referrer-Policy: strict-origin-when-cross-origin
  -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://www.gstatic.com; style-src 'self'; img-src 'self' data: blob:; font-src 'self' data:; media-src 'self' blob:; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000 https://www.gstatic.com https://challenges.cloudflare.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:;">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Auxilia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Auxilia</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
