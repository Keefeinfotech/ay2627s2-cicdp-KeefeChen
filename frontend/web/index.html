<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Auxilia keeps study tasks, reminders and shared group work in one calm workspace.">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <!--
    Content Security Policy is served as an HTTP header from the production
    host (frontend/nginx.conf) instead of a <meta> tag here. Keep it that way:

    * Local debug sessions (`flutter run -d chrome`) inject inline bootstrap
      scripts (the dwds debug client, e.g. `window.$dartRunMain();`) that a
      <meta> CSP would block, leaving a blank page with a broken debug
      session. A static <meta> tag cannot issue per-response nonces, so it
      cannot allow the debug bootstrap while staying strict for release.
      The backend follows the same prod-only pattern (helmet CSP disabled
      in development).
    * Meta tags cannot set frame-ancestors or HSTS anyway, so the nginx
      header is the effective enforcement point regardless.
    * Keep the header CSP strict: script-src without 'unsafe-inline' or
      'unsafe-eval'. 'wasm-unsafe-eval' is required for the CanvasKit WASM
      engine and is not the same directive as 'unsafe-eval'. Styles allow
      'unsafe-inline' (Flutter injects <style> elements at boot). Fonts
      allow fonts.gstatic.com for the Roboto WOFF2 fetch Flutter makes at
      runtime; without it the page renders blank on Firefox.
    * API calls are limited to the backend origin (localhost in dev) plus
      gstatic.com for CanvasKit and challenges.cloudflare.com for Turnstile.
      Do not use an 'https:' wildcard as it allows connections to any HTTPS
      domain.

    The production host also serves:
      Content-Security-Policy: frame-ancestors 'none'
      Strict-Transport-Security: max-age=31536000; includeSubDomains
      X-Content-Type-Options: nosniff
      Referrer-Policy: strict-origin-when-cross-origin
  -->

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Auxilia">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Auxilia</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
