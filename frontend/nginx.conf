server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Strict Content-Security-Policy, served as a header (the <meta> tag was
    # removed from web/index.html so `flutter run` debug sessions work).
    # Headers beat <meta> and cannot be stripped by markup. This is the single
    # source of truth for the frontend CSP.
    #
    # __API_ORIGIN__ is replaced at IMAGE BUILD time by the frontend Dockerfile
    # using the API_BASE_URL build argument. On Render that argument is the
    # deployed HTTPS backend origin; in docker-compose it is localhost. Keep
    # the placeholder (do not hardcode an onrender.com hostname here) so the
    # same config works for local E2E and production.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob:; connect-src 'self' blob: __API_ORIGIN__ http://localhost:3000 http://127.0.0.1:3000 https://www.gstatic.com https://challenges.cloudflare.com https://fonts.gstatic.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Flutter uses client-side routing: fall back to index.html.
    # index.html must always revalidate so deploys propagate immediately.
    # NOTE: `expires` sets Cache-Control without add_header, so the security
    # headers above are inherited (add_header in a location would drop them).
    # blob: in connect-src is required so the app can fetch images generated
    # in-memory (CanvasKit texture loads and image previews) as blob: URLs.
    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    # Flutter engine artifacts under versioned/fingerprinted paths
    # (canvaskit, flutter_bootstrap, assets) are safe to cache long-term.
    location ~* ^/(canvaskit|assets|icons|flutter_service_worker\.js) {
        expires 1y;
        try_files $uri =404;
    }

    # Hashed-looking entry bundles: cache for a day, revalidate after.
    location ~* \.(js|css|wasm)$ {
        expires 1d;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }

    # No /api/ reverse proxy: the Flutter app sends every API request to the
    # absolute API_BASE_URL compiled in by --dart-define. A proxy to the
    # compose-only host `backend:3000` would fail nginx startup on Render,
    # where that hostname does not exist.
}
