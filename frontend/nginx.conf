server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Strict Content-Security-Policy, served as a header (the <meta> tag was
    # removed from web/index.html so `flutter run` debug sessions work; the
    # release build is unaffected by the header change). Headers beat <meta>
    # and cannot be stripped by markup. This is now the single source of truth
    # for the frontend CSP — keep script-src without 'unsafe-inline'.
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; form-action 'self'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data: https://fonts.gstatic.com; media-src 'self' blob:; connect-src 'self' http://localhost:3000 http://127.0.0.1:3000 https://www.gstatic.com https://challenges.cloudflare.com https://fonts.gstatic.com; frame-src https://challenges.cloudflare.com; worker-src 'self' blob:;" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Flutter uses client-side routing: fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Forward API calls to the backend service.
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
