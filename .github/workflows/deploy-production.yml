name: Production Deployment (manual / emergency)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: render-production-backend
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy - Render Production (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    env:
      DEPLOYED_COMMIT: ${{ github.sha }}
    environment:
      name: production
      url: ${{ vars.RENDER_API_BASE_URL }}
    steps:
      - name: Checkout merged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Trigger Render deploy for the exact commit
        id: trigger_render
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          if [[ -n "${RENDER_API_KEY:-}" && -n "${RENDER_SERVICE_ID:-}" ]]; then
            status="$(curl --proto "=https" -sS -o /dev/null -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"commit\":{\"id\":\"$DEPLOYED_COMMIT\"}}" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
            if [[ "$status" != "201" && "$status" != "200" ]]; then
              echo "::error::Render deploy API returned HTTP $status"
              exit 1
            fi
            echo "Requested Render deploy of $DEPLOYED_COMMIT."
          elif [[ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]]; then
            curl --proto "=https" -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy hook triggered (fallback)."
          else
            echo "::notice::No deploy credentials configured; relying on platform auto-deploy if enabled."
          fi

      - name: Wait for the backend to become healthy
        id: wait_health
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SMOKE_BASE_URL:-}" ]]; then
            echo "::error::RENDER_API_BASE_URL is not set."
            exit 1
          fi
          for attempt in $(seq 1 60); do
            code="$(curl --proto "=https" -s -o /dev/null -w '%{http_code}' "$SMOKE_BASE_URL/api/health" || true)"
            echo "health probe ${attempt}/60 -> HTTP ${code:-000}"
            if [[ "$code" == "200" ]]; then
              echo "Service healthy after ${attempt} probe(s)."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend never returned 200 from $SMOKE_BASE_URL/api/health within 10 minutes."
          exit 1

      - name: Run post-deployment smoke checks
        id: smoke
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
        run: |
          set -euo pipefail
          node scripts/smoke-test.mjs "$SMOKE_BASE_URL"

      - name: Record deployment trace
        if: always()
        env:
          DEPLOYMENT_RESULT: ${{ job.status }}
        run: |
          {
            echo "## Render Production Deployment (manual)"
            echo ""
            echo "- Result: $DEPLOYMENT_RESULT"
            echo "- Source commit: $DEPLOYED_COMMIT"
            echo "- Workflow: $GITHUB_WORKFLOW"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist last good SHA
        id: persist_last_good
        if: success()
        env:
          GH_VARIABLES_TOKEN: ${{ secrets.GH_VARIABLES_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${GH_VARIABLES_TOKEN:-}" ]]; then
            echo "::notice::GH_VARIABLES_TOKEN is not configured. Skipping LAST_GOOD_SHA persistence; automatic rollback will be unavailable until configured."
            echo "persisted=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if GH_TOKEN="$GH_VARIABLES_TOKEN" gh variable set LAST_GOOD_SHA \
            --body "$DEPLOYED_COMMIT" \
            --repo "$GITHUB_REPOSITORY"; then
            echo "Recorded $DEPLOYED_COMMIT as LAST_GOOD_SHA."
            echo "persisted=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Could not persist LAST_GOOD_SHA. Automatic rollback unavailable for this deployment."
            echo "persisted=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-rollback on failed deploy or smoke check
        if: >-
          failure() &&
          (steps.trigger_render.outcome == 'failure' ||
           steps.wait_health.outcome == 'failure' ||
           steps.smoke.outcome == 'failure')
        env:
          GH_TOKEN: ${{ secrets.GH_VARIABLES_TOKEN || github.token }}
          LAST_GOOD_SHA: ${{ vars.LAST_GOOD_SHA }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "Deployment or smoke validation failed for $DEPLOYED_COMMIT."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "${LAST_GOOD_SHA:-}" || "$LAST_GOOD_SHA" == "$DEPLOYED_COMMIT" ]]; then
            echo "::warning::No earlier LAST_GOOD_SHA is recorded. Roll back manually via Render Deploys page."
            {
              echo ""
              echo "No last-good SHA available; automatic rollback skipped."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "Triggering rollback to $LAST_GOOD_SHA."
          gh workflow run rollback.yml \
            --repo "$GITHUB_REPOSITORY" \
            --field commit_sha="$LAST_GOOD_SHA" \
            --field environment=production \
            --field reason="Automatic rollback after failed manual deploy of $DEPLOYED_COMMIT"
          {
            echo ""
            echo "Automatic rollback to $LAST_GOOD_SHA requested."
          } >> "$GITHUB_STEP_SUMMARY"

  zap-baseline:
    name: DAST - OWASP ZAP (production, advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [deploy-backend]
    if: ${{ needs.deploy-backend.result == 'success' }}
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run ZAP baseline against the deployed API
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: ${{ vars.RENDER_API_BASE_URL }}/api/health
          rules_file_name: .zap/rules.tsv
          cmd_options: '-a -i'
          allow_issue_writing: false
        continue-on-error: true