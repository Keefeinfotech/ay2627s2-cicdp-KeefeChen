name: Production Deployment

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: render-production-backend
  cancel-in-progress: false

jobs:
  deploy-backend:
    name: Deploy - Render Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.RENDER_API_BASE_URL }}

    steps:
      - name: Checkout merged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"

      - name: Trigger Render deploy
        shell: bash
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          set -euo pipefail
          # Render deploys automatically on push to main when the service is
          # connected to this repository (see render.yaml). If a deploy hook
          # secret is configured, trigger it explicitly so the deploy is
          # certain; otherwise fall through and rely on the Blueprint.
          if [[ -n "$RENDER_DEPLOY_HOOK_URL" ]]; then
            curl --proto "=https" -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy hook triggered."
          else
            echo "::notice::RENDER_DEPLOY_HOOK_URL is not set; relying on the Render service's auto-deploy from this push to main."
          fi

      - name: Wait for the backend to become healthy
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$SMOKE_BASE_URL" ]]; then
            echo "::error::RENDER_API_BASE_URL is not set."
            echo "::error::Set it to your Render service URL, e.g. https://auxilia-backend.onrender.com"
            echo "::error::GitHub: Settings > Secrets and variables > Actions > Variables > New repository variable"
            exit 1
          fi
          # Poll up to 10 minutes (60 x 10s) for a healthy deploy.
          for attempt in $(seq 1 60); do
            code="$(curl --proto "=https" -s -o /dev/null -w '%{http_code}' "$SMOKE_BASE_URL/api/health" || true)"
            echo "health probe ${attempt}/60 -> HTTP ${code:-000}"
            if [[ "$code" == "200" ]]; then
              echo "Service healthy after ${attempt} probe(s)."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Backend never returned 200 from $SMOKE_BASE_URL/api/health within 10 minutes."
          echo "::error::The most likely cause is that the Render service is failing at startup because"
          echo "::error::required environment variables are not set in the Render dashboard."
          echo "::error::In Render: Dashboard > your service > Environment > confirm each of the following is set:"
          echo "::error::  MONGODB_URI, JWT_SECRET (>=16 chars), CORS_ORIGIN, CAPTCHA_ENABLED=true, TURNSTILE_SECRET_KEY,"
          echo "::error::  and AI_API_KEY if AI_PROVIDER != mock. Also confirm health check path is /api/health."
          exit 1

      - name: Run post-deployment smoke checks
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
        run: |
          set -euo pipefail
          node scripts/smoke-test.mjs "$SMOKE_BASE_URL"

      - name: Record deployment trace
        if: always()
        env:
          DEPLOYMENT_RESULT: ${{ job.status }}
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          {
            echo "## Render Production Deployment"
            echo ""
            echo "- Result: $DEPLOYMENT_RESULT"
            echo "- Source commit: $DEPLOYED_COMMIT"
            echo "- Workflow: $GITHUB_WORKFLOW"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Record rollback instructions on failure
        if: failure()
        run: |
          {
            echo ""
            echo "Smoke validation or deployment failed. Review the Render deploy logs for this service, then roll back to the previous successful deploy from Render's Deploys page (or revert the offending commit on main) before retrying."
          } >> "$GITHUB_STEP_SUMMARY"
