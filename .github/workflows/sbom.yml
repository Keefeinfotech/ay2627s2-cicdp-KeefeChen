name: SBOM & SLSA Provenance

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  sbom:
    name: Generate SBOM & Attest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: sbom.spdx.json
      - name: Upload SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: sbom
          path: sbom.spdx.json
      # GitHub attestations are only available for public repositories
      # (and private repos with GitHub Advanced Security). On a private
      # user-owned repo this call fails with 403 "Feature not available",
      # so gate it on repository visibility instead of always running it.
      - name: Check repository visibility
        id: visibility
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          private="$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')"
          echo "attest=$([[ "$private" == "false" ]] && echo true || echo false)" >> "$GITHUB_OUTPUT"
      - name: Attest SBOM (SLSA)
        if: steps.visibility.outputs.attest == 'true'
        uses: actions/attest-sbom@v2
        with:
          subject-path: backend/package.json
          sbom-path: sbom.spdx.json
      - name: Note attestation skipped
        if: steps.visibility.outputs.attest != 'true'
        run: echo "::notice title=SBOM attestation skipped::Attestations require a public repository; the SBOM is still generated and uploaded as an artifact. Make the repo public (or enable Advanced Security) to sign it."
