name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Verify tag matches application versions
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); const tag=process.env.GITHUB_REF_NAME.replace(/^v/, ""); const backend=JSON.parse(fs.readFileSync("backend/package.json", "utf8")).version; const pubspec=fs.readFileSync("frontend/pubspec.yaml", "utf8"); const match=pubspec.match(/^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+/m); const frontend=match && match[1]; if (backend !== tag || frontend !== tag) { console.error(`Tag v${tag} does not match backend ${backend} and frontend ${frontend ?? "unknown"}`); process.exit(1); } console.log(`Release versions match: v${tag}`);'

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend install, checks and build
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run test:coverage
          npm run build

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: '3.47.8'
          cache: true

      - name: Frontend install, checks and web build
        working-directory: frontend
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze
          flutter test --coverage
          dart run tool/check_coverage.dart 60
          flutter build web --release

      - name: Package web release
        shell: bash
        run: |
          set -euo pipefail
          cd frontend/build/web
          tar -czf "../../../auxilia-web-${GITHUB_REF_NAME}.tar.gz" .

      - name: Upload web release artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: auxilia-web-${{ github.ref_name }}
          path: auxilia-web-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download web release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: auxilia-web-${{ github.ref_name }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: auxilia-web-${{ github.ref_name }}.tar.gz

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "auxilia-web-${GITHUB_REF_NAME}.tar.gz" \
            --verify-tag \
            --generate-notes \
            --title "Auxilia ${GITHUB_REF_NAME}"
