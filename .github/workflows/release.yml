name: Release (CI artifacts + integrated CD)

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify and build release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify tag matches application versions
        shell: bash
        run: |
          set -euo pipefail
          node -e 'const fs=require("fs"); const tag=process.env.GITHUB_REF_NAME.replace(/^v/, ""); const backend=JSON.parse(fs.readFileSync("backend/package.json", "utf8")).version; const pubspec=fs.readFileSync("frontend/pubspec.yaml", "utf8"); const match=pubspec.match(/^version:\s*([0-9]+\.[0-9]+\.[0-9]+)\+/m); const frontend=match && match[1]; if (backend !== tag || frontend !== tag) { console.error(`Tag v${tag} does not match backend ${backend} and frontend ${frontend ?? "unknown"}`); process.exit(1); } console.log(`Release versions match: v${tag}`);'

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Backend install, checks and build
        working-directory: backend
        run: |
          npm ci --ignore-scripts
          npm run typecheck
          npm run test:coverage
          npm run build

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: 'stable'
          flutter-version: '3.47.8'
          cache: true

      - name: Frontend install, checks and web build
        working-directory: frontend
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test tool integration_test
          flutter analyze
          flutter test --coverage
          dart run tool/check_coverage.dart 62
          flutter build web --release

      - name: Package web release
        shell: bash
        run: |
          set -euo pipefail
          cd frontend/build/web
          tar -czf "../../../auxilia-web-${GITHUB_REF_NAME}.tar.gz" .

      - name: Upload web release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auxilia-web-${{ github.ref_name }}
          path: auxilia-web-${{ github.ref_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release (artifacts + SBOM/provenance)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Download web release artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: auxilia-web-${{ github.ref_name }}

      - name: Generate SBOM (Syft)
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: auxilia-web-${{ github.ref_name }}.tar.gz
          format: spdx-json
          output-file: auxilia-web-${{ github.ref_name }}.sbom.spdx.json

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            auxilia-web-${{ github.ref_name }}.tar.gz
            auxilia-web-${{ github.ref_name }}.sbom.spdx.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            "auxilia-web-${GITHUB_REF_NAME}.tar.gz" \
            "auxilia-web-${GITHUB_REF_NAME}.sbom.spdx.json" \
            --verify-tag \
            --generate-notes \
            --title "Auxilia ${GITHUB_REF_NAME}"

  deploy_staging:
    name: Deploy to Staging (same SHA)
    needs: [verify, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    environment:
      name: staging
      url: ${{ vars.RENDER_API_BASE_URL }}
    steps:
      - name: Checkout (for smoke script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Deploy exact SHA to staging (Render)
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${RENDER_API_KEY:-}" && -n "${RENDER_SERVICE_ID:-}" ]]; then
            status="$(curl --proto "=https" -sS -o /dev/null -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"commit\":{\"id\":\"$DEPLOYED_COMMIT\"}}" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
            if [[ "$status" != "201" && "$status" != "200" ]]; then
              echo "::error::Render deploy API returned HTTP $status (staging)"
              exit 1
            fi
            echo "Requested Render deploy of $DEPLOYED_COMMIT to staging."
          elif [[ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]]; then
            curl --proto "=https" -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy hook triggered for staging (fallback)."
          else
            echo "::error::Configure staging environment secrets/vars: RENDER_API_KEY+RENDER_SERVICE_ID or RENDER_DEPLOY_HOOK_URL."
            exit 1
          fi

      - name: Wait for staging to become healthy
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SMOKE_BASE_URL:-}" ]]; then
            echo "::error::RENDER_API_BASE_URL is not set for staging environment."
            exit 1
          fi
          for attempt in $(seq 1 60); do
            code="$(curl --proto "=https" -s -o /dev/null -w '%{http_code}' "$SMOKE_BASE_URL/api/health" || true)"
            echo "staging health probe ${attempt}/60 -> HTTP ${code:-000}"
            if [[ "$code" == "200" ]]; then
              echo "Staging healthy after ${attempt} probe(s)."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Staging never returned 200 from /api/health within 10 minutes."
          exit 1

      - name: Run staging smoke checks
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
        run: |
          set -euo pipefail
          node scripts/smoke-test.mjs "$SMOKE_BASE_URL"

  deploy_production:
    name: Deploy to Production (CD, after approval)
    needs: [deploy_staging]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: write
    environment:
      name: production
      url: ${{ vars.RENDER_API_BASE_URL }}
    steps:
      - name: Checkout (for smoke script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Deploy exact SHA to production (Render)
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [[ -n "${RENDER_API_KEY:-}" && -n "${RENDER_SERVICE_ID:-}" ]]; then
            status="$(curl --proto "=https" -sS -o /dev/null -w '%{http_code}' \
              -X POST \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"commit\":{\"id\":\"$DEPLOYED_COMMIT\"}}" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
            if [[ "$status" != "201" && "$status" != "200" ]]; then
              echo "::error::Render deploy API returned HTTP $status (production)"
              exit 1
            fi
            echo "Requested Render deploy of $DEPLOYED_COMMIT to production."
          elif [[ -n "${RENDER_DEPLOY_HOOK_URL:-}" ]]; then
            curl --proto "=https" -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
            echo "Render deploy hook triggered for production (fallback)."
          else
            echo "::notice::No production deploy credentials configured; ensure Render auto-deploy or configure secrets."
          fi

      - name: Wait for production to become healthy
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "${SMOKE_BASE_URL:-}" ]]; then
            echo "::error::RENDER_API_BASE_URL is not set for production environment."
            exit 1
          fi
          for attempt in $(seq 1 60); do
            code="$(curl --proto "=https" -s -o /dev/null -w '%{http_code}' "$SMOKE_BASE_URL/api/health" || true)"
            echo "prod health probe ${attempt}/60 -> HTTP ${code:-000}"
            if [[ "$code" == "200" ]]; then
              echo "Production healthy after ${attempt} probe(s)."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Production never returned 200 from /api/health within 10 minutes."
          exit 1

      - name: Run production smoke checks
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
        run: |
          set -euo pipefail
          node scripts/smoke-test.mjs "$SMOKE_BASE_URL"

      - name: Record deployment trace
        if: always()
        env:
          DEPLOYMENT_RESULT: ${{ job.status }}
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          {
            echo "## Release Production Deployment"
            echo ""
            echo "- Tag: $GITHUB_REF_NAME"
            echo "- Result: $DEPLOYMENT_RESULT"
            echo "- Source commit: $DEPLOYED_COMMIT"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Persist last good SHA
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          gh variable set LAST_GOOD_SHA --body "$DEPLOYED_COMMIT" --repo "$GITHUB_REPOSITORY"
          echo "Recorded $DEPLOYED_COMMIT as LAST_GOOD_SHA."

      - name: Auto-rollback on failed deploy or smoke check
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          LAST_GOOD_SHA: ${{ vars.LAST_GOOD_SHA }}
          DEPLOYED_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          {
            echo ""
            echo "Production deploy/smoke failed for ${GITHUB_REF_NAME} ($DEPLOYED_COMMIT)."
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -z "${LAST_GOOD_SHA:-}" || "$LAST_GOOD_SHA" == "$DEPLOYED_COMMIT" ]]; then
            echo "::error::No earlier LAST_GOOD_SHA recorded; manual rollback required."
            exit 1
          fi
          echo "Triggering rollback to $LAST_GOOD_SHA."
          gh workflow run rollback.yml \
            --repo "$GITHUB_REPOSITORY" \
            --field commit_sha="$LAST_GOOD_SHA" \
            --field environment=production \
            --field reason="Auto rollback after failed release deploy of ${GITHUB_REF_NAME} ($DEPLOYED_COMMIT)"
          {
            echo ""
            echo "Auto-rollback workflow dispatched to restore $LAST_GOOD_SHA."
          } >> "$GITHUB_STEP_SUMMARY"