name: Update golden baselines

# Temporary helper used during PR 145 to regenerate TaskCard golden images
# with the same Linux/Flutter combination as the CI frontend job.

on:
  push:
    branches:
      - feature/ci-cd-delivery-hardening
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch or ref to update"
        required: true
        default: "feature/ci-cd-delivery-hardening"

permissions:
  contents: read

jobs:
  update-goldens:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Regenerate golden baselines
        run: flutter test test/visual --update-goldens

      - name: Upload updated goldens
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: updated-goldens
          path: frontend/test/visual/goldens
          if-no-files-found: error
          retention-days: 7
