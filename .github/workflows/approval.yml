name: Approval Workflow

on:
  workflow_dispatch:
    inputs:
      request:
        description: "Description of the item requiring approval"
        required: true
        type: string
  pull_request:
    types: [opened, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  request-approval:
    name: Request Approval
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    # Configure required reviewers for the "approval" environment in
    # GitHub -> Settings -> Environments -> approval -> Required reviewers.
    # Until configured, this job runs without a manual gate.
    environment: approval
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Record approval request
        run: |
          echo "Approval requested for: ${{ github.event.inputs.request || github.event.pull_request.title }}"
          echo "Triggered by: ${{ github.actor }}"
          echo "Branch: ${{ github.head_ref || github.ref_name }}"
          echo "Commit: ${{ github.sha }}"

  post-approval:
    name: Post-Approval Action
    runs-on: ubuntu-latest
    needs: request-approval
    if: success()
    steps:
      - name: Approval granted
        run: |
          echo "Approval gate passed. Proceeding with post-approval steps."
          echo "Add deployment, merge, or notification steps here."