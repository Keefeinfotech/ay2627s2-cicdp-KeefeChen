name: Publish Images

# Builds the exact revisions that passed CI into immutable GHCR images.
# These images are the release candidates that promote.yml / rollback.yml should
# deploy by digest, so production no longer rebuilds from source at deploy time.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  backend:
    name: Build & publish backend image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve image name and log in to GHCR
        id: meta
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/backend"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push by commit SHA
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Tag release version when a version tag is pushed
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  frontend:
    name: Build & publish web image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
      image: ${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve image name and log in to GHCR
        id: meta
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          image="ghcr.io/$(printf '%s' "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')/web"
          echo "image=$image" >> "$GITHUB_OUTPUT"
          printf '%s' "$GITHUB_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push by commit SHA
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          push: true
          build-args: |
            API_BASE_URL=${{ vars.FRONTEND_API_BASE_URL || 'https://ay2627s2-cicdp-keefechen-1.onrender.com' }}
          tags: ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  digests:
    name: Record immutable digests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend, frontend]
    steps:
      - name: Write digest manifest
        env:
          BACKEND_IMAGE: ${{ needs.backend.outputs.image }}
          BACKEND_DIGEST: ${{ needs.backend.outputs.digest }}
          FRONTEND_IMAGE: ${{ needs.frontend.outputs.image }}
          FRONTEND_DIGEST: ${{ needs.frontend.outputs.digest }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          {
            echo "commit: $COMMIT_SHA"
            echo "backend: ${BACKEND_IMAGE}@${BACKEND_DIGEST}"
            echo "frontend: ${FRONTEND_IMAGE}@${FRONTEND_DIGEST}"
          } | tee digests.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest manifest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-digests-${{ github.sha }}
          path: digests.txt
          retention-days: 90
