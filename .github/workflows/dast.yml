name: DAST - OWASP ZAP

on:
  schedule:
    - cron: "0 2 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - 'backend/**'

jobs:
  zap:
    name: DAST - OWASP ZAP Baseline
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Build & run backend
        run: |
          cd backend
          npm ci --ignore-scripts
          npm run build
          MONGODB_URI=mongodb://localhost:27017/auxilia JWT_SECRET=ci-test-only-jwt-secret PORT=3000 node dist/server.js &
          sleep 15
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: 'http://localhost:3000/api/health'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a -i'
          allow_issue_writing: false
