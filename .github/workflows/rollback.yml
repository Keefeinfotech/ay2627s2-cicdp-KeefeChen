name: Rollback Production

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to roll back to"
        required: true
        type: string

permissions:
  contents: write

jobs:
  rollback:
    name: Rollback - Render Production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit_sha }}
          fetch-depth: 0
      - name: Force-push rollback commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -B rollback/${{ inputs.commit_sha }}
          git push origin rollback/${{ inputs.commit_sha }} --force-with-lease
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [[ -n "$RENDER_DEPLOY_HOOK_URL" ]]; then
            curl --proto "=https" -fsSL -X POST "$RENDER_DEPLOY_HOOK_URL"
          fi
