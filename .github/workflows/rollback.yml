name: Rollback Production

# Deploys an exact, previously successful commit by calling Render's Deploy API.
# The old deploy-hook approach pushed a `rollback/<sha>` branch and then called a
# hook that deploys the service's *connected* branch - i.e. it redeployed the
# broken main HEAD. Do not revert to that pattern.
on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Full commit SHA of the last known good deploy"
        required: true
        type: string
      environment:
        description: "Environment to roll back"
        required: true
        type: choice
        default: production
        options: [staging, production]
      reason:
        description: "Incident / reason (recorded in the run summary)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: rollback-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback - Render ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: ${{ inputs.environment }}
      url: ${{ vars.RENDER_API_BASE_URL }}
    steps:
      - name: Validate requested commit
        shell: bash
        env:
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          if [[ ! "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character lowercase SHA, got: $COMMIT_SHA"
            exit 1
          fi

      - name: Checkout (for smoke script)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.commit_sha }}

      - name: Check Render credentials are configured
        id: config
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [[ -z "$RENDER_API_KEY" || -z "$RENDER_SERVICE_ID" ]]; then
            echo "::error::RENDER_API_KEY secret and RENDER_SERVICE_ID variable must be set on the '${{ inputs.environment }}' environment."
            exit 1
          fi
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Deploy the last known good SHA via Render API
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ vars.RENDER_SERVICE_ID }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          response="$(mktemp)"
          status="$(curl --proto "=https" -sS -o "$response" -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"commit\":{\"id\":\"$COMMIT_SHA\"}}" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")"
          if [[ "$status" != "201" && "$status" != "200" ]]; then
            echo "::error::Render deploy API returned HTTP $status"
            cat "$response"
            exit 1
          fi
          echo "Requested deploy of $COMMIT_SHA."

      - name: Wait for rollback to become healthy
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
        run: |
          set -euo pipefail
          if [[ -z "$SMOKE_BASE_URL" ]]; then
            echo "::error::RENDER_API_BASE_URL is not set on the '${{ inputs.environment }}' environment."
            exit 1
          fi
          for attempt in $(seq 1 60); do
            code="$(curl --proto "=https" -s -o /dev/null -w '%{http_code}' "$SMOKE_BASE_URL/api/health" || true)"
            echo "health probe ${attempt}/60 -> HTTP ${code:-000}"
            if [[ "$code" == "200" ]]; then
              echo "Service healthy after ${attempt} probe(s)."
              exit 0
            fi
            sleep 10
          done
          echo "::error::Service never returned 200 from /api/health within 10 minutes."
          exit 1

      - name: Run post-rollback smoke checks
        shell: bash
        env:
          SMOKE_BASE_URL: ${{ vars.RENDER_API_BASE_URL }}
        run: node scripts/smoke-test.mjs "$SMOKE_BASE_URL"

      - name: Record rollback
        if: always()
        env:
          RESULT: ${{ job.status }}
          DEPLOYED_SHA: ${{ inputs.commit_sha }}
          REASON: ${{ inputs.reason }}
          TARGET: ${{ inputs.environment }}
        run: |
          {
            echo "## Render rollback"
            echo ""
            echo "- Result: $RESULT"
            echo "- Environment: $TARGET"
            echo "- Restored commit: $DEPLOYED_SHA"
            echo "- Reason: ${REASON:-not provided}"
            echo "- Triggered by: ${{ github.actor }}"
          } >> "$GITHUB_STEP_SUMMARY"
