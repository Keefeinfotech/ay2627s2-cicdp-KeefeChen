name: Mutation Testing (Stryker)

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 04:00 UTC (after the integration job)
    - cron: "0 4 * * 1"

permissions:
  contents: read

concurrency:
  group: mutation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stryker:
    name: Mutation - Backend (Stryker)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run Stryker (scoped to critical modules)
        run: npx stryker run --reporters clear-text,progress,json

      - name: Upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-report
          path: backend/reports/mutation/*.json
          if-no-files-found: ignore
          retention-days: 14
