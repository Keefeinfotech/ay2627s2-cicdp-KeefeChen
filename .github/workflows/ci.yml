name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "feat/**"
      - "release/**"
      - "hotfix/**"

  pull_request:
    branches:
      - main
      - develop
      - "release/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # STAGE 0: DEPENDENCY REVIEW (PULL REQUESTS)
  # ==========================================

  dependency-review:
    name: Dependencies - Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  # ==========================================
  # STAGE 1: SECURITY VALIDATION
  # ==========================================

  security-scan:
    name: Security - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Scan filesystem vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-results.sarif

  secret-scan:
    name: Security - Secret Detection
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Detect committed secrets
        shell: bash
        run: |
          set -euo pipefail

          patterns=(
            'AKIA[0-9A-Z]{16}'
            '-----BEGIN (RSA |EC |OPENSSH |PGP |)PRIVATE KEY-----'
            'ghp_[A-Za-z0-9]{36}'
            'gho_[A-Za-z0-9]{36}'
            'xox[baprs]-[A-Za-z0-9-]{10,}'
            'AIza[0-9A-Za-z_-]{35}'
          )

          failed=0

          for pattern in "${patterns[@]}"; do
            if git grep -n -E -e "$pattern" -- . ':!.github/workflows'; then
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "::error::Potential secrets detected."
            exit 1
          fi

          echo "No configured secret patterns detected."

  # ==========================================
  # STAGE 2: BACKEND VALIDATION
  # ==========================================

  backend:
    name: Backend - Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build backend
        run: npm run build

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================
  # STAGE 2: FRONTEND VALIDATION
  # ==========================================

  frontend:
    name: Frontend - Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Static analysis
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce coverage threshold
        run: dart run tool/check_coverage.dart 60

      - name: Build Flutter web
        run: flutter build web --release

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================
  # STAGE 3: CODE QUALITY ANALYSIS
  # ==========================================

  sonarqube:
    name: Code Quality - SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend]

    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # Skip external fork PRs where repository secrets
    # are not available.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository

    steps:
      - name: Checkout repository
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download backend coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

      - name: SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@v6
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  # ==========================================
  # STAGE 4: PIPELINE AGGREGATION
  # ==========================================

  ci-summary:
    name: CI - Final Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - dependency-review
      - security-scan
      - secret-scan
      - backend
      - frontend
      - sonarqube

    if: always()

    steps:
      - name: Evaluate pipeline results
        shell: bash
        env:
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          SECURITY: ${{ needs.security-scan.result }}
          SECRETS: ${{ needs.secret-scan.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          SONAR: ${{ needs.sonarqube.result }}

        run: |
          {
            echo "## Auxilia CI Pipeline Summary"
            echo ""
            echo "| Quality Gate | Result |"
            echo "|---|---|"
            echo "| Dependency Review | $DEPENDENCY_REVIEW |"
            echo "| Security Scan | $SECURITY |"
            echo "| Secret Detection | $SECRETS |"
            echo "| Backend | $BACKEND |"
            echo "| Frontend | $FRONTEND |"
            echo "| SonarQube | $SONAR |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0

          for result in \
            "$DEPENDENCY_REVIEW" \
            "$SECURITY" \
            "$SECRETS" \
            "$BACKEND" \
            "$FRONTEND" \
            "$SONAR"; do

            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "::error::One or more CI quality gates failed."
            exit 1
          fi

          echo "All required CI quality gates passed."
