name: CI

# Enterprise 4-stage pipeline.
#   Stage 1  Preflight & fast security   (PR-only checks + always-on secret/SAST scans)
#   Stage 2  Build, test & artifacts     (backend / frontend, parallel)
#   Stage 3  Deep quality & image CVEs   (SonarQube gate / Trivy, parallel)
#   Stage 4  Integration & final gate    (E2E + live performance smoke, then one required check)
#
# Only "CI - Final Quality Gate" should be required in Branch Protection.

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "feat/**"
      - "release/**"
      - "hotfix/**"
  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    # No paths-ignore: the required Final Quality Gate must report on every PR,
    # including docs-only ones, or those PRs could never merge.
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to build (defaults to the triggering ref)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================================================
  # STAGE 1 - PREFLIGHT & FAST SECURITY (parallel)
  # PR-only jobs are skipped on push by design; Stage 2+ explicitly tolerates
  # that "skipped" state so pushes never lose their build/test coverage.
  # ==========================================================================

  pr-conventions:
    name: "1 · Preflight · PR Conventions"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Check Conventional Commit title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node .github/scripts/check-pr-title.mjs
      - name: Check branch name convention
        env:
          BRANCH_NAME: ${{ github.head_ref }}
        run: node .github/scripts/check-branch-name.mjs

  dependency-review:
    name: "1 · Preflight · Dependency Review"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Review dependency changes in the PR diff
        uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          fail-on-severity: high

  gitleaks:
    name: "1 · Security · Gitleaks"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Scan tracked files for secrets
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --pull=always --network none \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/repo,readonly" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --redact --no-banner --exit-code 1 .

  codeql:
    name: "1 · Security · CodeQL"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      # Fork PRs have read-only tokens: analyze, but never try to upload SARIF.
      # On private repos without GHAS, analysis still runs; upload is opt-in.
      - name: Decide SARIF upload capability
        id: upload
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mode=always
          if [[ "${{ github.event_name }}" == "pull_request" && \
                "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            mode=never
            echo "Fork pull request: analysis runs, SARIF upload disabled."
          elif [[ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')" == "true" && \
                  "${{ vars.CODE_SCANNING_ENABLED }}" != 'true' ]]; then
            mode=never
            echo "Private repository without GitHub Advanced Security: SARIF upload disabled."
          fi
          echo "mode=${mode}" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"
          upload: ${{ steps.upload.outputs.mode }}

  # ==========================================================================
  # STAGE 2 - BUILD, TEST & ARTIFACTS (parallel, after Stage 1)
  # `always()` keeps the job alive when PR-only Stage 1 jobs are skipped on
  # push; failure/cancelled of ANY Stage 1 job still stops the build.
  # ==========================================================================

  backend-build:
    name: "2 · Build · Backend"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [pr-conventions, dependency-review, gitleaks, codeql]
    if: >-
      ${{
        always() &&
        needs.pr-conventions.result != 'failure' &&
        needs.pr-conventions.result != 'cancelled' &&
        needs.dependency-review.result != 'failure' &&
        needs.dependency-review.result != 'cancelled' &&
        needs.gitleaks.result == 'success' &&
        needs.codeql.result == 'success'
      }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Verify Prettier formatting (changed files only)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: npm run format:check
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: ESLint and TypeScript checks
        run: npm run lint
      - name: Unit / integration / contract tests with coverage
        run: npm run test:coverage
      - name: Compile TypeScript
        run: npm run build
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build backend image (cached, loaded for Stage 3)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          tags: auxilia-backend:ci
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Save backend image for the container scan
        run: docker save auxilia-backend:ci -o /tmp/backend-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-image
          path: /tmp/backend-image.tar
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 7

  frontend-build:
    name: "2 · Build · Frontend"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pr-conventions, dependency-review, gitleaks, codeql]
    if: >-
      ${{
        always() &&
        needs.pr-conventions.result != 'failure' &&
        needs.pr-conventions.result != 'cancelled' &&
        needs.dependency-review.result != 'failure' &&
        needs.dependency-review.result != 'cancelled' &&
        needs.gitleaks.result == 'success' &&
        needs.codeql.result == 'success'
      }}
    permissions:
      contents: read
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Verify formatting
        # --no-fatal-infos: pre-existing style infos must not fail; errors/warnings do.
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test test_driver
      - name: Static analysis
        run: flutter analyze --no-fatal-infos
      - name: Unit / widget tests with coverage
        run: flutter test --coverage
      - name: Enforce 62% line coverage gate
        run: dart run tool/check_coverage.dart 62
      - name: Build production web bundle
        run: flutter build web --release
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build frontend image (cached, loaded for Stage 3)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./frontend
          tags: auxilia-frontend:ci
          load: true
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
      - name: Save frontend image for the container scan
        run: docker save auxilia-frontend:ci -o /tmp/frontend-image.tar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-image
          path: /tmp/frontend-image.tar
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================================================
  # STAGE 3 - DEEP QUALITY & CONTAINER SECURITY (parallel, after Stage 2)
  # A single quality gate enforces the SonarCloud analysis that already runs
  # for every commit. It verifies the posted check run and the project quality
  # gate via GITHUB_TOKEN, so no scanner token (or duplicate SonarCloud job)
  # is required.
  # ==========================================================================

  sonarqube-quality-gate:
    name: "3 · Quality · SonarQube Quality Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-build, frontend-build]
    if: ${{ always() && needs.backend-build.result == 'success' && needs.frontend-build.result == 'success' }}
    permissions:
      contents: read
      checks: read
    steps:
      - name: Verify SonarCloud quality gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SONAR_PROJECT_KEY: Keefeinfotech_ay2627s2-cicdp-KeefeChen
          SONAR_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail

          # SonarCloud Automatic Analysis posts a "SonarCloud Code Analysis"
          # check run for the analysed commit. Trust its conclusion when it
          # exists; otherwise fall back to the project's quality gate status.
          conclusion=""
          for attempt in {1..12}; do
            conclusion="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$SONAR_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "SonarCloud Code Analysis") | .conclusion] | first // ""' \
              2>/dev/null || true)"
            if [[ -n "$conclusion" ]]; then
              break
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done

          case "$conclusion" in
            success|neutral|skipped)
              echo "SonarCloud analysis check concluded '$conclusion' for $SONAR_SHA."
              exit 0
              ;;
            "")
              echo "No SonarCloud check run for $SONAR_SHA; checking the '$SONAR_BRANCH' quality gate."
              ;;
            *)
              echo "::error::SonarCloud Code Analysis concluded '$conclusion' for $SONAR_SHA."
              exit 1
              ;;
          esac

          status="$(curl -fsS \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY&branch=$SONAR_BRANCH" \
            2>/dev/null | jq -r '.projectStatus.status // empty' || true)"

          case "$status" in
            OK)
              echo "SonarCloud quality gate is OK for '$SONAR_BRANCH'."
              ;;
            NONE)
              echo "::warning::SonarCloud has no analysis recorded for '$SONAR_BRANCH'."
              ;;
            "")
              echo "::warning::Could not read the SonarCloud quality gate for '$SONAR_BRANCH'."
              ;;
            *)
              echo "::error::SonarCloud quality gate is '$status' for '$SONAR_BRANCH'."
              exit 1
              ;;
          esac

  trivy-container-scan:
    name: "3 · Security · Trivy Image Scan"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend-build, frontend-build]
    if: ${{ always() && needs.backend-build.result == 'success' && needs.frontend-build.result == 'success' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-image
          path: /tmp/images
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: frontend-image
          path: /tmp/images
      - name: Load both images
        shell: bash
        run: |
          set -euo pipefail
          docker load -i /tmp/images/backend-image.tar
          docker load -i /tmp/images/frontend-image.tar
      - name: Scan backend image (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: auxilia-backend:ci
          ignore-unfixed: true
          format: sarif
          output: trivy-backend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Scan frontend image (HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: auxilia-frontend:ci
          ignore-unfixed: true
          format: sarif
          output: trivy-frontend.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"
      - name: Publish scan results
        if: ${{ always() && hashFiles('trivy-*.sarif') != '' }}
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          # Glob picks up both backend and frontend SARIF reports.
          sarif_file: trivy-*.sarif

  # ==========================================================================
  # STAGE 4 - INTEGRATION, PERFORMANCE & FINAL GATE
  # ==========================================================================

  e2e-suite:
    name: "4 · Integration · Playwright E2E"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [sonarqube-quality-gate, trivy-container-scan]
    # The Playwright suite is the slowest gate (~4m). Reserve it for PRs and
    # manual full runs; Stages 1-3 still run on every push, and the Final
    # Quality Gate treats this job's "skipped" result as pass on non-PR events.
    if: >-
      ${{
        always() &&
        (github.event_name == 'pull_request' ||
         github.event_name == 'workflow_dispatch') &&
        needs.sonarqube-quality-gate.result == 'success' &&
        needs.trivy-container-scan.result == 'success'
      }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Build and start the full stack
        run: docker compose up -d --build
      - name: Wait for the stack to become healthy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            if curl -fsS http://localhost:8080/ > /dev/null 2>&1 \
               && curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Stack is ready after $((attempt * 5))s."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Stack did not become ready in time."
          docker compose ps
          docker compose logs --tail=200
          exit 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci --ignore-scripts
      - name: Install Playwright browsers
        working-directory: e2e
        run: ./node_modules/.bin/playwright install --with-deps
      - name: Run Playwright E2E suite
        working-directory: e2e
        env:
          CI: true
          E2E_BASE_URL: http://localhost:8080
          E2E_API_URL: http://localhost:3000
        run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  performance-smoke:
    name: "4 · Performance · API Latency & Load"
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [sonarqube-quality-gate, trivy-container-scan]
    # Same policy as E2E: the live-stack load smoke (~4m) runs on PRs and
    # manual dispatch only. Every push still gets Stages 1-3.
    if: >-
      ${{
        always() &&
        (github.event_name == 'pull_request' ||
         github.event_name == 'workflow_dispatch') &&
        needs.sonarqube-quality-gate.result == 'success' &&
        needs.trivy-container-scan.result == 'success'
      }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - name: Build and start the full stack
        run: docker compose up -d --build
      - name: Wait for the stack to become healthy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            if curl -fsS http://localhost:8080/ > /dev/null 2>&1 \
               && curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Stack is ready after $((attempt * 5))s."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Stack did not become ready in time."
          docker compose ps
          docker compose logs --tail=200
          exit 1
      - name: Performance - API latency against the live stack
        shell: bash
        run: |
          set -euo pipefail
          samples=$(mktemp)
          for _ in $(seq 1 40); do
            start=$(date +%s%N)
            curl -fsS http://localhost:3000/api/health > /dev/null
            end=$(date +%s%N)
            echo $(( (end - start) / 1000000 )) >> "$samples"
          done
          sort -n "$samples" -o "$samples"
          index=$(( ($(wc -l < "$samples") * 95 + 99) / 100 ))
          p95=$(sed -n "${index}p" "$samples")
          echo "Live /api/health p95 = ${p95} ms (budget 500 ms)"
          if (( p95 > 500 )); then
            echo "::error::Live p95 ${p95} ms exceeds the 500 ms budget."
            exit 1
          fi
      - name: Performance - API error budget smoke
        working-directory: backend
        env:
          PERF_DURATION_S: "20"
          PERF_CONCURRENCY: "50"
          PERF_MAX_P95_MS: "500"
        run: |
          npm ci --ignore-scripts
          npm run test:performance
      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  ci-final-gate:
    name: "4 · Gate · CI Final Quality Gate"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - pr-conventions
      - dependency-review
      - gitleaks
      - codeql
      - backend-build
      - frontend-build
      - sonarqube-quality-gate
      - trivy-container-scan
      - e2e-suite
      - performance-smoke
    if: always()
    permissions:
      contents: read
    steps:
      - name: Verify every required stage succeeded
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_CONVENTIONS: ${{ needs.pr-conventions.result }}
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          CODEQL: ${{ needs.codeql.result }}
          BACKEND: ${{ needs.backend-build.result }}
          FRONTEND: ${{ needs.frontend-build.result }}
          SONAR: ${{ needs.sonarqube-quality-gate.result }}
          TRIVY: ${{ needs.trivy-container-scan.result }}
          E2E_SUITE: ${{ needs.e2e-suite.result }}
          PERFORMANCE: ${{ needs.performance-smoke.result }}
        run: |
          set -uo pipefail
          {
            echo "## Auxilia CI - 4 Stage Quality Gate"
            echo ""
            echo "| Stage | Job | Result |"
            echo "|---|---|---|"
            echo "| 1 Preflight | PR Conventions | ${PR_CONVENTIONS} |"
            echo "| 1 Preflight | Dependency Review | ${DEPENDENCY_REVIEW} |"
            echo "| 1 Security | Gitleaks | ${GITLEAKS} |"
            echo "| 1 Security | CodeQL | ${CODEQL} |"
            echo "| 2 Build | Backend | ${BACKEND} |"
            echo "| 2 Build | Frontend | ${FRONTEND} |"
            echo "| 3 Quality | SonarQube Quality Gate | ${SONAR} |"
            echo "| 3 Security | Trivy Images | ${TRIVY} |"
            echo "| 4 Integration | Playwright E2E | ${E2E_SUITE} |"
            echo "| 4 Performance | API Latency & Load | ${PERFORMANCE} |"
            echo ""
            echo "_Stage 4 (Playwright E2E and performance smoke) runs on pull requests and manual dispatches only._"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          check() {
            local name="$1" result="$2" optional_on_push="$3"
            case "$result" in
              success) ;;
              skipped)
                # PR-only checks and the expensive Stage 4 suite are skipped
                # by design on non-PR events. On a PR they must still succeed.
                if [[ "$optional_on_push" == "true" && "$EVENT" != "pull_request" ]]; then
                  echo "::notice::${name} skipped (not required for this event)."
                else
                  echo "::error::${name} was skipped unexpectedly."
                  failed=1
                fi
                ;;
              failure|cancelled)
                echo "::error::${name} ${result}."
                failed=1
                ;;
              *)
                echo "::error::${name} has unknown result '${result}'."
                failed=1
                ;;
            esac
          }

          check "PR Conventions"      "$PR_CONVENTIONS"     true
          check "Dependency Review"   "$DEPENDENCY_REVIEW"  true
          check "Gitleaks"            "$GITLEAKS"           false
          check "CodeQL"              "$CODEQL"             false
          check "Backend Build"       "$BACKEND"            false
          check "Frontend Build"      "$FRONTEND"           false
          check "SonarQube Gate"      "$SONAR"              false
          check "Trivy Image Scan"    "$TRIVY"              false
          check "Playwright E2E"      "$E2E_SUITE"          true
          check "Performance Smoke"   "$PERFORMANCE"        true

          if (( failed )); then
            echo "::error::One or more required quality gates did not succeed."
            exit 1
          fi
          echo "All required CI quality gates passed."
