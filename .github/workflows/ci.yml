name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "feat/**"
      - "release/**"
      - "hotfix/**"

  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'CONTRIBUTING.md'
      - 'docs/**'

  workflow_dispatch:
    inputs:
      ref:
        description: 'Branch, tag, or SHA to run against'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # STAGE 0: DEPENDENCY REVIEW (PULL REQUESTS)
  # ==========================================

  dependency-review:
    name: Dependencies - Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  pr-conventions:
    name: Source Control - PR Conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Conventional Commit title
        run: node .github/scripts/check-pr-title.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Check branch name convention
        run: node .github/scripts/check-branch-name.mjs
        env:
          BRANCH_NAME: ${{ github.head_ref }}

  # ==========================================
  # STAGE 1: SECURITY VALIDATION
  # ==========================================

  security-scan:
    name: Security - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      - name: Cache Docker layers
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Scan filesystem vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: sarif
          output: trivy-filesystem-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Build backend container for scanning
        uses: docker/build-push-action@32945a339266b759abcbdc89316275140b0fc960 # v6.8.0
        with:
          context: ./backend
          tags: auxilia-backend:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          load: true

      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Scan backend container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: auxilia-backend:ci
          ignore-unfixed: true
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy filesystem results
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-filesystem-results.sarif

      - name: Upload Trivy image results
        uses: github/codeql-action/upload-sarif@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image-results.sarif

  secret-scan:
    name: Security - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan tracked files with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --pull=always --network none \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/repo,readonly" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --redact --no-banner --exit-code 1 .

  codeql:
    name: Security - CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@9418214df1f2c4b8128c770156c409013b07d6b9 # v3.39.3
        with:
          category: "/language:javascript-typescript"
          # Fork pull requests have read-only GITHUB_TOKEN permissions. Keep
          # the analysis job green there, but only upload SARIF when allowed.
          upload: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'never' || 'always' }}

  # ==========================================
  # STAGE 2: BACKEND VALIDATION
  # ==========================================

  backend:
    name: Backend - Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pr-conventions, secret-scan]

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Prettier formatting
        run: npm run format:check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: ESLint and TypeScript checks
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build backend
        run: npm run build

      - name: Upload backend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================
  # STAGE 2: FRONTEND VALIDATION
  # ==========================================

  frontend:
    name: Frontend - Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pr-conventions, secret-scan]

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Static analysis
        # --no-fatal-infos: pre-existing style info lints (e.g.
        # prefer_initializing_formals) must not fail the job; errors and
        # warnings still do.
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce coverage threshold
        run: dart run tool/check_coverage.dart 60

      - name: Build Flutter web
        run: flutter build web --release

      - name: Upload frontend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================
  # STAGE 3: CODE QUALITY ANALYSIS

  sonarqube-automatic:
    name: Code Quality - SonarCloud Automatic Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend]
    permissions:
      checks: read

    # Read the SonarCloud check already posted for this commit. This keeps the
    # quality gate in the pipeline without starting a conflicting scanner.
    if: >-
      vars.SONAR_ANALYSIS_MODE != 'ci' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Verify SonarCloud quality gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SONAR_PROJECT_KEY: Keefeinfotech_ay2627s2-cicdp-KeefeChen
          SONAR_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail

          conclusion=""
          for attempt in {1..12}; do
            conclusion="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$SONAR_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "SonarCloud Code Analysis") | .conclusion] | first // ""' \
              2>/dev/null || true)"
            if [[ -n "$conclusion" ]]; then
              break
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done

          case "$conclusion" in
            success|neutral|skipped)
              echo "SonarCloud analysis check concluded '$conclusion' for $SONAR_SHA."
              exit 0
              ;;
            "")
              echo "No SonarCloud check run for $SONAR_SHA; checking the '$SONAR_BRANCH' quality gate."
              ;;
            *)
              echo "::error::SonarCloud Code Analysis concluded '$conclusion' for $SONAR_SHA."
              exit 1
              ;;
          esac

          status="$(curl -fsS \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY&branch=$SONAR_BRANCH" \
            2>/dev/null | jq -r '.projectStatus.status // empty' || true)"

          case "$status" in
            OK)
              echo "SonarCloud quality gate is OK for '$SONAR_BRANCH'."
              ;;
            NONE)
              echo "::warning::SonarCloud has no analysis recorded for '$SONAR_BRANCH'."
              ;;
            "")
              echo "::warning::Could not read the SonarCloud quality gate for '$SONAR_BRANCH'."
              ;;
            *)
              echo "::error::SonarCloud quality gate is '$status' for '$SONAR_BRANCH'."
              exit 1
              ;;
          esac

  # ==========================================
  # STAGE 4: PIPELINE AGGREGATION
  # ==========================================

  ci-summary:
    name: CI - Final Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - dependency-review
      - pr-conventions
      - security-scan
      - secret-scan
      - codeql
      - backend
      - frontend
      - sonarqube-automatic

    if: always()

    steps:
      - name: Evaluate pipeline results
        shell: bash
        env:
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          PR_CONVENTIONS: ${{ needs.pr-conventions.result }}
          SECURITY: ${{ needs.security-scan.result }}
          SECRETS: ${{ needs.secret-scan.result }}
          CODEQL: ${{ needs.codeql.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          SONAR_AUTOMATIC: ${{ needs.sonarqube-automatic.result }}

        run: |
          {
            echo "## Auxilia CI Pipeline Summary"
            echo ""
            echo "| Quality Gate | Result |"
            echo "|---|---|"
            echo "| Dependency Review | $DEPENDENCY_REVIEW |"
            echo "| PR Conventions | $PR_CONVENTIONS |"
            echo "| Security Scan | $SECURITY |"
            echo "| Gitleaks | $SECRETS |"
            echo "| CodeQL | $CODEQL |"
            echo "| Backend | $BACKEND |"
            echo "| Frontend | $FRONTEND |"
            echo "| SonarCloud Automatic Analysis | $SONAR_AUTOMATIC |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0

          for result in \
            "$DEPENDENCY_REVIEW" \
            "$PR_CONVENTIONS" \
            "$SECURITY" \
            "$SECRETS" \
            "$CODEQL" \
            "$BACKEND" \
            "$FRONTEND" \
            "$SONAR_AUTOMATIC"; do

            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "::error::One or more CI quality gates failed."
            exit 1
          fi

          echo "All required CI quality gates passed."
