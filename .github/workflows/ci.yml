name: CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "feat/**"
      - "release/**"
      - "hotfix/**"

  pull_request:
    branches:
      - main
      - develop
      - "release/**"
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - "CONTRIBUTING.md"
      - "docs/**"

  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag, or SHA to run against"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # STAGE 0: DEPENDENCY REVIEW (PULL REQUESTS)
  # ==========================================

  dependency-review:
    name: Dependencies - Review
    # Dependency Review requires the dependency graph over the PR diff, which
    # is unavailable for this user-owned private repository (it demands
    # GitHub Advanced Security). It is therefore opt-in: set the repo
    # variable DEPENDENCY_REVIEW_ENABLED='true' once the repo is eligible.
    if: github.event_name == 'pull_request' && vars.DEPENDENCY_REVIEW_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high

  pr-conventions:
    name: Source Control - PR Conventions
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check Conventional Commit title
        run: node .github/scripts/check-pr-title.mjs
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}

      - name: Check branch name convention
        run: node .github/scripts/check-branch-name.mjs
        env:
          BRANCH_NAME: ${{ github.head_ref }}

  # ==========================================
  # STAGE 1: SECURITY VALIDATION
  # ==========================================

  security-scan:
    name: Security - Trivy
    runs-on: ubuntu-latest
    timeout-minutes: 15

    permissions:
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Cache Docker layers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Scan filesystem vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          ignore-unfixed: true
          format: sarif
          output: trivy-filesystem-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Build backend container for scanning
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./backend
          tags: auxilia-backend:ci
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new
          load: true

      - name: Move Docker cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Scan backend container image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: auxilia-backend:ci
          ignore-unfixed: true
          format: sarif
          output: trivy-image-results.sarif
          severity: CRITICAL,HIGH
          exit-code: "1"

      - name: Upload Trivy filesystem results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-filesystem-results.sarif

      - name: Upload Trivy image results
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        continue-on-error: true
        with:
          sarif_file: trivy-image-results.sarif

  secret-scan:
    name: Security - Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Scan tracked files with Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --pull=always --network none \
            --mount "type=bind,source=${GITHUB_WORKSPACE},target=/repo,readonly" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            dir --redact --no-banner --exit-code 1 .

  codeql:
    name: Security - CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      actions: read
      contents: read
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check whether code scanning upload is possible
        id: codeql_upload
        env:
          GH_TOKEN: ${{ github.token }}
        # Fork PRs get read-only tokens: they analyze but never upload.
        # Same-repo PRs on private repositories cannot upload SARIF unless
        # code scanning (GitHub Advanced Security) is available, which
        # depends on the plan. Set the repo variable CODE_SCANNING_ENABLED
        # to 'true' once it is and SARIF upload turns back on everywhere.
        run: |
          upload=always
          if [[ "${{ github.event_name }}" == "pull_request" && \
                "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]]; then
            upload=never
            echo "Fork pull request: SARIF upload disabled."
          elif [[ "$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.private')" == "true" && \
                  "${{ vars.CODE_SCANNING_ENABLED }}" != 'true' ]]; then
            upload=never
            echo "Private repository without GitHub Advanced Security: SARIF upload disabled; analysis still runs."
          fi
          echo "upload=${upload}" >> "$GITHUB_OUTPUT"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript
          queries: security-extended

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:javascript-typescript"
          # Fork pull requests have read-only GITHUB_TOKEN permissions. Keep
          # the analysis job green there, but only upload SARIF when allowed.
          upload: ${{ steps.codeql_upload.outputs.upload }}

  # ==========================================
  # STAGE 2: BACKEND VALIDATION
  # ==========================================

  backend:
    name: Backend - Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pr-conventions, secret-scan]
    # pr-conventions only runs on pull requests; without this guard a push
    # event skips it and the whole backend/frontend/e2e chain is skipped too,
    # so pushes to main shipped untested. `failure()` still blocks the chain
    # when the conventions check genuinely fails.
    if: ${{ always() && needs.pr-conventions.result != 'failure' && needs.secret-scan.result != 'failure' }}

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Verify Prettier formatting
        run: npm run format:check
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

      # Dev-only audit findings (e.g. picomatch GHSA-fc5q-39xc-vjpf, no patched
      # release) block merges; production dependencies are what we ship.
      - name: Audit dependencies (production)
        run: npm audit --omit=dev --audit-level=high

      - name: ESLint and TypeScript checks
        run: npm run lint

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build backend
        run: npm run build

      - name: Upload backend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================
  # STAGE 2: FRONTEND VALIDATION
  # ==========================================

  frontend:
    name: Frontend - Quality & Build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pr-conventions, secret-scan]
    # Push events skip pr-conventions; keep the chain alive but still stop on
    # a genuine failure of either dependency.
    if: ${{ always() && needs.pr-conventions.result != 'failure' && needs.secret-scan.result != 'failure' }}

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - name: Install dependencies
        run: flutter pub get --enforce-lockfile

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool integration_test

      - name: Static analysis
        # --no-fatal-infos: pre-existing style info lints (e.g.
        # prefer_initializing_formals) must not fail the job; errors and
        # warnings still do.
        run: flutter analyze --no-fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce coverage threshold
        run: dart run tool/check_coverage.dart 62

      - name: Build Flutter web
        run: flutter build web --release

      - name: Upload frontend coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  # ==========================================
  # STAGE 3: END-TO-END TESTING
  # ==========================================

  e2e:
    name: E2E - Docker Compose + Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [backend, frontend]
    # Skip the E2E chain gracefully when upstream jobs were skipped (e.g. a
    # failed pr-conventions blocks backend/frontend, so e2e would skip too);
    # only run when both quality jobs succeeded.
    if: ${{ always() && needs.backend.result == 'success' && needs.frontend.result == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build and start the full stack
        run: docker compose up -d --build

      - name: Wait for the stack to become healthy
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..90}; do
            if curl -fsS http://localhost:8080/ > /dev/null 2>&1 \
               && curl -fsS http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "Stack is ready after $((attempt * 5))s."
              exit 0
            fi
            sleep 5
          done
          echo "::error::Stack did not become ready in time."
          docker compose ps
          docker compose logs --tail=200
          exit 1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install E2E dependencies
        working-directory: e2e
        run: npm ci --ignore-scripts

      - name: Install Playwright browsers
        working-directory: e2e
        run: ./node_modules/.bin/playwright install --with-deps

      - name: Run Playwright E2E tests
        working-directory: e2e
        env:
          CI: true
          E2E_BASE_URL: http://localhost:8080
          E2E_API_URL: http://localhost:3000
        run: npm test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Tear down the stack
        if: always()
        run: docker compose down -v

  performance:
    name: Performance - API Latency & Error Budget
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Opt-in via the Actions tab only; keeps routine CI fast while making the
    # load smoke a first-class, repeatable check.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --ignore-scripts

      - name: Run the API performance smoke test
        working-directory: backend
        env:
          PERF_DURATION_S: "20"
          PERF_CONCURRENCY: "50"
          PERF_MAX_P95_MS: "500"
        run: npm run test:performance

  # ==========================================
  # STAGE 4: CODE QUALITY ANALYSIS
  # ==========================================

  sonarqube:
    name: Code Quality - SonarQube (CI Analysis)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [backend]

    # SonarCloud Automatic Analysis is enabled for this project. The scanner
    # cannot run at the same time, so CI analysis is opt-in after switching
    # the SonarCloud project to CI-based analysis.
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

    # Skip external fork PRs where repository secrets
    # are not available.
    if: >-
      vars.SONAR_ANALYSIS_MODE == 'ci' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Require Sonar token for CI analysis
        if: ${{ env.SONAR_TOKEN == '' }}
        run: |
          echo "::error::SONAR_TOKEN is required when SONAR_ANALYSIS_MODE=ci."
          exit 1

      - name: Checkout repository
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download backend coverage
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: backend-coverage
          path: backend/coverage

      - name: SonarQube analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        with:
          projectBaseDir: backend
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

  sonarqube-automatic:
    name: Code Quality - SonarCloud Automatic Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend]
    permissions:
      checks: read

    # Read the SonarCloud check already posted for this commit. This keeps the
    # quality gate in the pipeline without starting a conflicting scanner.
    if: >-
      vars.SONAR_ANALYSIS_MODE != 'ci' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Verify SonarCloud quality gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SONAR_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SONAR_PROJECT_KEY: Keefeinfotech_ay2627s2-cicdp-KeefeChen
          SONAR_BRANCH: ${{ github.base_ref || github.ref_name }}
        run: |
          set -euo pipefail

          conclusion=""
          for attempt in {1..12}; do
            conclusion="$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$SONAR_SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "SonarCloud Code Analysis") | .conclusion] | first // ""' \
              2>/dev/null || true)"
            if [[ -n "$conclusion" ]]; then
              break
            fi
            if [[ "$attempt" -lt 12 ]]; then
              sleep 5
            fi
          done

          case "$conclusion" in
            success|neutral|skipped)
              echo "SonarCloud analysis check concluded '$conclusion' for $SONAR_SHA."
              exit 0
              ;;
            "")
              echo "No SonarCloud check run for $SONAR_SHA; checking the '$SONAR_BRANCH' quality gate."
              ;;
            *)
              echo "::error::SonarCloud Code Analysis concluded '$conclusion' for $SONAR_SHA."
              exit 1
              ;;
          esac

          status="$(curl -fsS \
            "https://sonarcloud.io/api/qualitygates/project_status?projectKey=$SONAR_PROJECT_KEY&branch=$SONAR_BRANCH" \
            2>/dev/null | jq -r '.projectStatus.status // empty' || true)"

          case "$status" in
            OK)
              echo "SonarCloud quality gate is OK for '$SONAR_BRANCH'."
              ;;
            NONE)
              echo "::warning::SonarCloud has no analysis recorded for '$SONAR_BRANCH'."
              ;;
            "")
              echo "::warning::Could not read the SonarCloud quality gate for '$SONAR_BRANCH'."
              ;;
            *)
              echo "::error::SonarCloud quality gate is '$status' for '$SONAR_BRANCH'."
              exit 1
              ;;
          esac

  # ==========================================
  # STAGE 5: PIPELINE AGGREGATION
  # ==========================================

  ci-summary:
    name: CI - Final Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 5

    needs:
      - dependency-review
      - pr-conventions
      - security-scan
      - secret-scan
      - codeql
      - backend
      - frontend
      - e2e
      - performance
      - sonarqube
      - sonarqube-automatic

    if: always()

    steps:
      - name: Evaluate pipeline results
        shell: bash
        env:
          DEPENDENCY_REVIEW: ${{ needs.dependency-review.result }}
          PR_CONVENTIONS: ${{ needs.pr-conventions.result }}
          SECURITY: ${{ needs.security-scan.result }}
          SECRETS: ${{ needs.secret-scan.result }}
          CODEQL: ${{ needs.codeql.result }}
          BACKEND: ${{ needs.backend.result }}
          FRONTEND: ${{ needs.frontend.result }}
          E2E: ${{ needs.e2e.result }}
          PERFORMANCE: ${{ needs.performance.result }}
          SONAR_CI: ${{ needs.sonarqube.result }}
          SONAR_AUTOMATIC: ${{ needs.sonarqube-automatic.result }}

        run: |
          {
            echo "## Auxilia CI Pipeline Summary"
            echo ""
            echo "| Quality Gate | Result |"
            echo "|---|---|"
            echo "| Dependency Review | $DEPENDENCY_REVIEW |"
            echo "| PR Conventions | $PR_CONVENTIONS |"
            echo "| Security Scan | $SECURITY |"
            echo "| Gitleaks | $SECRETS |"
            echo "| CodeQL | $CODEQL |"
            echo "| Backend | $BACKEND |"
            echo "| Frontend | $FRONTEND |"
            echo "| E2E (Docker Compose + Playwright) | $E2E |"
            echo "| Performance (workflow_dispatch only) | $PERFORMANCE |"
            echo "| SonarQube CI Analysis | $SONAR_CI |"
            echo "| SonarCloud Automatic Analysis | $SONAR_AUTOMATIC |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0

          for result in \
            "$DEPENDENCY_REVIEW" \
            "$PR_CONVENTIONS" \
            "$SECURITY" \
            "$SECRETS" \
            "$CODEQL" \
            "$BACKEND" \
            "$FRONTEND" \
            "$E2E" \
            "$PERFORMANCE" \
            "$SONAR_CI" \
            "$SONAR_AUTOMATIC"; do

            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              failed=1
            fi
          done

          if [[ "$failed" -ne 0 ]]; then
            echo "::error::One or more CI quality gates failed."
            exit 1
          fi

          echo "All required CI quality gates passed."
