name: CI

on:
  push:
    branches: [ main, develop, 'feature/**', 'feat/**', 'release/**', 'hotfix/**' ]
  pull_request:
    branches: [ main, develop, 'feature/**', 'feat/**', 'release/**' ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review dependency changes
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high

  security-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

  secret-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan for committed secrets
        shell: bash
        run: |
          set -euo pipefail
          patterns=(
            'AKIA[0-9A-Z]{16}'
            '-----BEGIN (RSA |EC |OPENSSH |PGP |)PRIVATE KEY-----'
            'ghp_[A-Za-z0-9]{36}'
            'gho_[A-Za-z0-9]{36}'
            'xox[baprs]-[A-Za-z0-9-]{10,}'
            'AIza[0-9A-Za-z_-]{35}'
          )
          failed=0
          for pattern in "${patterns[@]}"; do
            if git grep -n -E -e "$pattern" -- . ':!.github/workflows'; then
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo '::error::A high-confidence secret pattern was found in the tree.'
            exit 1
          fi
          echo 'No high-confidence secrets detected.'

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Type check
        run: npm run typecheck

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Build
        run: npm run build

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore
          retention-days: 7

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: '3.47.8'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test tool

      - name: Analyze
        run: flutter analyze

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Enforce coverage gate
        run: dart run tool/check_coverage.dart 60

      - name: Build (web)
        run: flutter build web --release

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 7

  ci-summary:
    runs-on: ubuntu-latest
    needs: [dependency-review, security-scan, secret-scan, backend, frontend]
    if: always()
    permissions:
      contents: read
    steps:
      - name: Report results
        shell: bash
        run: |
          {
            echo '## CI summary'
            echo ''
            echo "- dependency-review: ${{ needs.dependency-review.result }}"
            echo "- security-scan: ${{ needs.security-scan.result }}"
            echo "- secret-scan: ${{ needs.secret-scan.result }}"
            echo "- backend: ${{ needs.backend.result }}"
            echo "- frontend: ${{ needs.frontend.result }}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ "${{ contains(needs.*.result, 'failure') }}" == "true" ]]; then
            echo '::error::One or more jobs failed. Check the logs above and the uploaded coverage artifacts.'
            exit 1
          fi
          echo 'All quality gates passed.'
