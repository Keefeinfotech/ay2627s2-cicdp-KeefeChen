name: Integration

on:
  workflow_dispatch:
  schedule:
    # Weekly, Monday 03:00 UTC
    - cron: "0 3 * * 1"
  pull_request:
    paths:
      - "frontend/**"

permissions:
  contents: read

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-integration:
    name: Integration - integration_test (Android Emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Java
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Setup Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: "3.47.8"
          cache: true

      - name: Install dependencies
        working-directory: frontend
        run: flutter pub get --enforce-lockfile

      # The same script the local run uses; drives the real app on the
      # emulator and asserts the cold-start intro -> login path.
      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: medium_phone
          emulator-boot-timeout: 600
          script: cd frontend && flutter test integration_test --reporter expanded
