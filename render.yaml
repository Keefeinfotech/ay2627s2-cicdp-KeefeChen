# Render Blueprint for the Auxilia production services.
#
# Render deploys these services automatically on every push to `main`. The
# GitHub Actions workflow in .github/workflows/deploy-production.yml triggers
# the backend deploy hook and then waits for /api/health before smoke-checking;
# this keeps a single deploy path instead of two competing pipelines.
#
# HOW TO APPLY
#   Render Dashboard > New > Blueprint > select this repository. Render reads
#   this file, provisions the service, and prompts for every `sync: false`
#   variable below. If the service already exists in the dashboard, align
#   `name` (or point the dashboard at this file as a Blueprint) so Render
#   manages the same service rather than creating a duplicate.
#
#   If the deployed URL returns HTTP 404 with the header
#   `x-render-routing: no-server`, no service is registered at that hostname:
#   the Blueprint was never applied (or the service was deleted/suspended).
#   Applying this file is the fix.
#
# Sensitive values (JWT_SECRET, MONGODB_URI, TURNSTILE_SECRET_KEY, SMTP_*,
# AI_API_KEY, ...) must be set in the Render dashboard — the Blueprint
# declares them as `sync: false` so they are prompted for, never hard-coded.

services:
  - type: web
    name: auxilia-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    # Starter is always-on. The free plan suspends after inactivity and the
    # first request can wait ~50 s for a wake; with the frontend's 12 s API
    # timeout that makes the first sign-in after a quiet period fail.
    plan: starter
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Render injects PORT automatically (default 10000) for web services.
      # The app binds 0.0.0.0 on that port — do not set PORT here or the
      # deploy will boot on one port while Render probes another.
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "true"
      # Non-secret configuration; safe to pin here.
      - key: CAPTCHA_ENABLED
        value: "true"
      - key: AI_PROVIDER
        value: mock
      # Required secrets — Render prompts for these when applying the
      # Blueprint. The backend exits at startup without them
      # (assertRuntimeEnv), so the health check would never pass.
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      # Exact deployed web origin of the Flutter frontend, e.g.
      # https://auxilia-web.onrender.com (comma-separated if several).
      # No trailing slash. This MUST match the origin the browser sends, or
      # every API request is rejected with 403 CORS_FORBIDDEN.
      - key: CORS_ORIGIN
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      # Optional — only when the corresponding feature is used:
      # - key: TURNSTILE_SITE_KEY        # frontend build (GitHub Pages/static site)
      # - key: SMTP_HOST / SMTP_USER / SMTP_PASS / EMAIL_FROM   # email delivery
      # - key: AI_PROVIDER / AI_BASE_URL / AI_MODEL / AI_API_KEY # non-mock AI
      # - key: API_BASE_URL              # frontend build only
#
# IMMUTABLE ARTIFACTS: `.github/workflows/publish-image.yml` pushes SHA-tagged
# backend/web images to GHCR after CI passes. Prefer deploying those digests via
# the Render Deploy API (promote.yml / rollback.yml) over rebuilding from source
# at deploy time; the services below keep their git connection as a fallback.

  # ------------------------------------------------------------------
  # Flutter web frontend (separate free Docker web service).
  # Uses the same Dockerfile as docker-compose; Render turns env vars into
  # Docker build arguments, so API_BASE_URL is compiled in via --dart-define
  # and the Nginx CSP is templated from the same origin. No code hardcodes
  # localhost: the local default in the Dockerfile only applies to compose.
  # ------------------------------------------------------------------
  - type: web
    name: auxilia-web
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    # Starter is always-on so the login screen is served immediately instead
    # of after a ~50 s free-tier wake. Staging below stays on the free plan.
    plan: starter
    region: singapore
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Render services route to the port named by PORT. Nginx listens on
      # 8080 (same as docker-compose), so keep them aligned.
      - key: PORT
        value: "8080"
      # Public, non-secret build configuration. This must be the HTTPS URL of
      # the backend service above (the deployed service behind
      # RENDER_API_BASE_URL). Change it if the backend is deployed elsewhere.
      - key: API_BASE_URL
        value: https://ay2627s2-cicdp-keefechen-1.onrender.com
      # Public Cloudflare Turnstile site key. Render passes env vars to Docker
      # as build args, so this is compiled into the Flutter app via the
      # --dart-define in frontend/Dockerfile. It must belong to the same widget
      # as the backend's TURNSTILE_SECRET_KEY, and the widget must allow
      # auxilia-web.onrender.com as a hostname.
      - key: TURNSTILE_SITE_KEY
        sync: false

  # ------------------------------------------------------------------
  # Staging (isolated): not auto-deployed. `promote.yml` targets it with
  # environment-scoped RENDER_SERVICE_ID / RENDER_DEPLOY_HOOK_URL /
  # RENDER_API_BASE_URL values, so staging never shares production config.
  # ------------------------------------------------------------------
  - type: web
    name: auxilia-backend-staging
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: singapore
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: staging
      - key: TRUST_PROXY
        value: "true"
      - key: CAPTCHA_ENABLED
        value: "false"
      - key: AI_PROVIDER
        value: mock
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
      - key: METRICS_TOKEN
        sync: false

  - type: web
    name: auxilia-web-staging
    runtime: docker
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    plan: free
    region: singapore
    healthCheckPath: /
    autoDeploy: false
    envVars:
      - key: PORT
        value: "8080"
      # Staging backend origin - supply when applying the Blueprint.
      - key: API_BASE_URL
        sync: false
