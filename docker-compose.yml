# Auxilia - Local Development Environment
#
# Spins up MongoDB, the Express backend, and the Flutter web frontend together
# so the full stack runs locally with `docker compose up`.
#
# Usage:
#   cp backend/.env.example backend/.env   # configure values
#   docker compose up --build
#
# Services:
#   mongodb   - Database (persisted in mongodb_data volume)
#   backend   - Express API (http://localhost:3000)
#   frontend  - Flutter web app served by Nginx (http://localhost:8080)

services:
  # ------------------------------------------------------------------
  # Database
  # ------------------------------------------------------------------
  mongodb:
    image: mongo:7.0.14-jammy
    container_name: auxilia-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.runCommand({ping:1})"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------
  # Backend API
  # ------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      cache_from:
        - auxilia-backend:cache
    container_name: auxilia-backend
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      MONGODB_URI: mongodb://mongodb:27017/auxilia
      # Development-only default so a fresh clone works out of the box.
      # REQUIRED in real deployments: set JWT_SECRET (>= 16 chars) in .env or
      # the environment before exposing the stack.
      JWT_SECRET: ${JWT_SECRET:-auxilia-local-development-secret-change-me}
      JWT_EXPIRES_IN: 15m
      REFRESH_TOKEN_EXPIRES_IN: 30d
      SESSION_CACHE_TTL_MS: 30000
      BCRYPT_ROUNDS: 10
      CORS_ORIGIN: http://localhost:8080,http://localhost:3000
      TRUST_PROXY: "true"
      CAPTCHA_ENABLED: "false"
      AI_PROVIDER: mock
      AI_MODEL: mock-model
      AI_BASE_URL: https://api.openai.com/v1
      AI_MAX_TOKENS: 400
      AI_TIMEOUT_MS: 15000
      AI_RATE_LIMIT_PER_USER: 20
      API_RATE_LIMIT_MAX: 300
      # Local/CI runs fire many requests from 127.0.0.1; the production
      # default would 429 the E2E suite. Raise it in dev only.
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-10000}
      APP_BASE_URL: http://localhost:8080
      BACKEND_URL: http://localhost:3000
      # Local-only default for the /metrics guard — matches the token in
      # monitoring/prometheus.yml. Override with METRICS_TOKEN for real use.
      METRICS_TOKEN: ${METRICS_TOKEN:-auxilia-local-metrics-token}
    healthcheck:
      # 127.0.0.1, not localhost: in alpine, localhost resolves to ::1 while
      # the server listens on 0.0.0.0 (IPv4), so wget against localhost is
      # refused and the container flaps unhealthy.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ------------------------------------------------------------------
  # Frontend (Flutter web, served by Nginx)
  # ------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - API_BASE_URL=http://localhost:3000
    container_name: auxilia-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:8080"

  # ------------------------------------------------------------------
  # Jenkins (optional): local CI/CD server running the root Jenkinsfile.
  # Start with:  docker compose --profile jenkins up -d --build
  # UI: http://localhost:8081  (initial admin password:
  #   docker exec auxilia-jenkins cat /var/jenkins_home/secrets/initialAdminPassword)
  # The image adds Node.js 22, Flutter 3.47.8 and the Docker CLI on top of
  # jenkins/jenkins:lts-jdk21 (see jenkins/Dockerfile). The host Docker
  # socket is mounted so the deploy stage can rebuild and restart this
  # same stack. See docs/development/jenkins.md.
  # ------------------------------------------------------------------
  jenkins:
    build:
      context: ./jenkins
      dockerfile: Dockerfile
    image: auxilia-jenkins:lts
    container_name: auxilia-jenkins
    profiles: ["jenkins"]
    restart: unless-stopped
    ports:
      # 8081 because the frontend already owns host port 8080.
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Lets the deploy stage run `docker compose` on the host engine.
      # Remove this mount if you do not want pipelines able to redeploy.
      - /var/run/docker.sock:/var/run/docker.sock

  # ------------------------------------------------------------------
  # Monitoring (optional): Prometheus + Grafana for the backend.
  # Start with:  docker compose --profile monitoring up -d
  # Grafana: http://localhost:3001  (admin / ${GRAFANA_ADMIN_PASSWORD:-admin})
  # Prometheus: http://localhost:9090
  # Never expose these ports or the METRICS_TOKEN publicly; the scrape
  # token above is a local-demo default, override it for anything real.
  # ------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: auxilia-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.3.0
    container_name: auxilia-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  mongodb_data:
  prometheus_data:
  grafana_data:
  jenkins_home:
